name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release zip
        run: python build_release.py

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import mimetypes
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          asset = Path("dist") / f"self-manager-{version}.zip"

          if not asset.exists():
              raise SystemExit(f"Missing release asset: {asset}")

          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, url, data=None, headers_extra=None):
              body = None
              req_headers = dict(headers)
              if headers_extra:
                  req_headers.update(headers_extra)
              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  req_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      content = response.read()
                      return json.loads(content.decode("utf-8")) if content else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          release = request("GET", f"{api}/releases/tags/{urllib.parse.quote(tag)}")
          if release is None:
              release = request(
                  "POST",
                  f"{api}/releases",
                  {
                      "tag_name": tag,
                      "name": f"Self Manager {tag}",
                      "body": f"Self Manager {tag} release package.",
                      "draft": False,
                      "prerelease": False,
                  },
              )

          for existing in release.get("assets", []):
              if existing.get("name") == asset.name:
                  request("DELETE", f"{api}/releases/assets/{existing['id']}")

          upload_base = release["upload_url"].split("{", 1)[0]
          upload_url = f"{upload_base}?{urllib.parse.urlencode({'name': asset.name})}"
          content_type = mimetypes.guess_type(asset.name)[0] or "application/octet-stream"
          req = urllib.request.Request(
              upload_url,
              data=asset.read_bytes(),
              headers={
                  **headers,
                  "Content-Type": content_type,
                  "Content-Length": str(asset.stat().st_size),
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              response.read()

          print(f"Published {asset} to {repo} release {tag}")
          PY
