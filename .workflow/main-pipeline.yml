version: '1.0'
name: main-build-release
displayName: 主干云端打包
stages:
  - stage:
    name: build_and_package
    displayName: 构建打包
    steps:
      - step: build@python
        name: verify_and_package
        displayName: 校验并生成发布包
        pythonVersion: '3.11'
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        commands:
          - python3 -m pip install --upgrade pip
          - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - pip3 install -r requirements-dev.txt
          - python3 -m black --check . --config black.toml
          - python3 -m ruff check .
          - python3 -m pytest tests -q
          - python3 scripts/build_release_bundle.py
      - step: publish@general_artifacts
        name: publish_general_artifacts
        displayName: 上传构建物
        dependArtifact: BUILD_ARTIFACT
        artifactName: self-manager-main-package
        dependsOn: verify_and_package
  - stage:
    name: release
    displayName: 发布
    steps:
      - step: publish@release_artifacts
        name: publish_release_artifacts
        displayName: 发布
        dependArtifact: self-manager-main-package
        version: '1.0.0.0'
        autoIncrement: true
triggers:
  push:
    branches:
      include:
        - main
