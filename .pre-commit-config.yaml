default_install_hook_types:
  - pre-commit
  - pre-push
default_language_version:
  python: python3.11
exclude: |
  (?x)^(
    \.oscanner/|
    \.pre-commit-cache/|
    \.pytest_cache/|
    __pycache__/|
    frontend/|
    logs/|
    productivity_manager\.db|
    skills/.*\.zip|
    tests/TEST2\.3\.PNG\.jpg
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - --config=.flake8
        additional_dependencies: []

  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3.11
        args:
          - --config
          - black.toml

  - repo: local
    hooks:
      - id: pytest-quality-gate
        name: pytest quality gate
        entry: python -m pytest tests -q
        language: python
        language_version: python3.11
        additional_dependencies:
          - fastapi
          - httpx
          - loguru
          - pytest
          - uvicorn
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
